name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build FrMat executable
        shell: powershell
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name FrMat `
            --collect-all matplotlib `
            --collect-all pandas `
            --collect-all PySide6 `
            --collect-all reportlab `
            --collect-all defusedxml `
            --collect-all docx `
            FrMat.py

      - name: Package built executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "dist\FrMat.exe" "release\FrMat.exe"
          Compress-Archive -Path "release\FrMat.exe" -DestinationPath "FrMat-Windows-Installer.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrMat-Windows-Installer
          path: |
            FrMat-Windows-Installer.zip
            dist/FrMat.exe
          if-no-files-found: error
